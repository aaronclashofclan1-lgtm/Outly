name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Discovery / enrichment
        - Audit / strategy
        - Studio / OAuth
        - Notes / board / plan
        - Research / ideas / hooks
        - Desktop UI
        - CLI / packaging
        - Documentation
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This request does not require sharing secrets or private data.
          required: true
